<!-- Grid and pen weights documented in default.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brows converging inward, clearing the eyes rather than sitting on them. -->
  <path d="M 20 27 L 42 36" fill="none" stroke="#14110f" stroke-width="9" stroke-linecap="round"/>
  <path d="M 80 27 L 58 36" fill="none" stroke="#14110f" stroke-width="9" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="8" fill="#14110f"/>
  <circle cx="68" cy="42" r="8" fill="#14110f"/>
  <!-- Gritted teeth. Same pen as everything else, which the old zig-zag was not. -->
  <path d="M 32 72 L 41 63 L 50 72 L 59 63 L 68 72" fill="none" stroke="#14110f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
