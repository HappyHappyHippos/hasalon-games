<!--
  Face grid, shared by all nine files in this directory.

    viewBox   0 0 100 100, ink kept inside x 18..82 and y 22..78
    eyes      centred on y = 42, at x = 32 and x = 68
    mouth     inside the band y = 62..74
    pen       9 for primary strokes, 7 for secondary detail (brows, bags, blush)
    palette   #14110f ink, white, #ff7675 coral. Nothing else.

  The pen width is the part that matters and the part that was wrong before.
  Avatar.tsx scales these by 26/100, so a 9 lands at 2.34 units against the head
  outline's 2.6 and reads as the same nib. The old files ranged 3 to 8, so most
  drew the face in a finer pen than the head it sat inside and looked like a
  decal stuck on rather than part of the drawing.

  Keeping the eye line and the mouth band fixed is the other half: they used to
  drift between y=35 and y=45, so stepping through the picker moved the face up
  and down the head.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="32" cy="42" r="8" fill="#14110f"/>
  <circle cx="34.5" cy="39" r="3.5" fill="white"/>
  <circle cx="68" cy="42" r="8" fill="#14110f"/>
  <circle cx="70.5" cy="39" r="3.5" fill="white"/>
  <path d="M 34 65 Q 50 75 66 65" fill="none" stroke="#14110f" stroke-width="9" stroke-linecap="round"/>
</svg>
