  <path d="M 59 45 Q 68 33 77 45" fill="none" stroke="#14110f" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="22" cy="57" rx="8" ry="5" fill="#ff7675" opacity="0.55"/>
  <ellipse cx="78" cy="57" rx="8" ry="5" fill="#ff7675" opacity="0.55"/>
  <!-- Open grin: ink mouth with the tongue nested inside it. -->
