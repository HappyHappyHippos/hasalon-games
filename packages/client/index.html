<!doctype html>
<!--
  Hebrew and RTL are baked into the markup, not applied by React, so the very
  first paint is already the right way round. `App` overwrites both the instant
  it mounts if the saved preference is English — but nobody ever sees a flash of
  the wrong direction on the default.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6e8" />
    <!--
      iOS Safari will not give a normal tab fullscreen, so the only way to lose
      its URL bar is the home-screen shortcut: these three tags plus the manifest
      are what make that shortcut open standalone instead of reopening Safari.
      `black-translucent` lets the arena run under the status bar; the safe-area
      insets already in the stylesheet keep the HUD out from under it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="הסלון" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta
      name="description"
      content="הסלון — משחקי כורסא עם כל המשפחה. Gun Mayhem ו-Achtung die Kurve, ישר בדפדפן."
    />
    <title>הסלון · hasalon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fdf6e8'/%3E%3Cg stroke='%2314110f' stroke-width='2.4' stroke-linejoin='round'%3E%3Cpath d='M6 18v-4a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v4' fill='%23ff5252'/%3E%3Crect x='4' y='16' width='24' height='7' rx='3' fill='%23ffd23f'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
