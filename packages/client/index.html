<!doctype html>
<!--
  Hebrew and RTL are baked into the markup, not applied by React, so the very
  first paint is already the right way round. `App` overwrites both the instant
  it mounts if the saved preference is English — but nobody ever sees a flash of
  the wrong direction on the default.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fdf6e8" />
    <!--
      iOS Safari will not give a normal tab fullscreen, so the only way to lose
      its URL bar is the home-screen shortcut: these three tags plus the manifest
      are what make that shortcut open standalone instead of reopening Safari.
      `black-translucent` lets the arena run under the status bar; the safe-area
      insets already in the stylesheet keep the HUD out from under it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="הסלון" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Non-transparent and unrounded on purpose — iOS applies its own mask
         and corner radius over whatever's here, so a couch already sitting on
         a rounded paper card would get cropped twice. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="הסלון — משחקי כורסא עם כל המשפחה. Gun Mayhem ו-Achtung die Kurve, ישר בדפדפן."
    />
    <title>הסלון · hasalon</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
